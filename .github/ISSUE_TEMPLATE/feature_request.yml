name: Feature request
description: Suggest an idea or enhancement
title: "feat: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Please search existing open and closed issues before filing. If the idea already exists, add a reaction or a comment on the existing issue instead of opening a new one.

  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Describe the use case or pain point. What are you trying to do that you cannot do today?
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: Describe what you would like to happen. Rough is fine.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Any workarounds you have tried, or other approaches you thought about.

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Links, sketches, or anything else that helps.

  - type: checkboxes
    id: confirmations
    attributes:
      label: Pre-submission checks
      options:
        - label: I have searched existing open and closed issues and this feature has not already been requested.
          required: true
