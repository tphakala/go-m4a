name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  GO_VERSION: '1.26'
  # Pinned to match the local toolchain so the linter version is identical
  # across developer machines and CI.
  GOLANGCI_LINT_VERSION: 'v2.12.2'

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}

      # The interop tests decode this writer's output with a third-party demuxer,
      # which is the only check that a real player agrees with the container we
      # emit. They skip when ffmpeg is absent, so without an explicit install the
      # suite would report success having never run them.
      - name: Install ffmpeg (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Download dependencies
        run: go mod download

      - name: Run tests
        if: matrix.os != 'ubuntu-latest'
        run: go test -race ./...

      # Coverage is generated once, on Linux, and uploaded to Codecov.
      # -coverpkg credits cross-package coverage so the subpackages exercised
      # through the container's public API are counted, not just the package
      # under test.
      - name: Run tests with coverage
        if: matrix.os == 'ubuntu-latest'
        run: go test -race -coverpkg=./... -coverprofile=coverage.out -covermode=atomic ./...

      - name: Upload coverage to Codecov
        if: matrix.os == 'ubuntu-latest'
        uses: codecov/codecov-action@v7
        with:
          files: coverage.out
          fail_ci_if_error: false

      # go-aac v0.5.0 inverted its SIMD build constraint: the kernels used to sit
      # behind an opt-in goaac_simd tag and are now the default, with -tags noasm
      # selecting the scalar Go path instead. That tag reaches go-aac through this
      # module, which makes the scalar path a supported build of go-m4a that
      # nothing else here covers, since no other job passes a build tag.
      #
      # Run the suite rather than a build: go build skips _test.go entirely, so it
      # would only prove the scalar path links, and this module has no build
      # constraints of its own that could fail to compile. Running it executes
      # go-aac's scalar kernels through aacm4a's fixtures.
      #
      # One target is enough. The constraint is tag-gated, not GOOS/GOARCH-gated,
      # so every platform selects the same files. Note the tag does NOT make the
      # binary assembly-free: it drops exactly one package (simd/f32), while
      # go-flac and go-opus link github.com/tphakala/simd unconditionally.
      - name: Run tests (-tags noasm)
        if: matrix.os == 'ubuntu-latest'
        run: go test -race -tags noasm ./...

  # The container parses untrusted bytes and does size/offset arithmetic that
  # must stay correct on 32-bit targets (BirdNET-Go ships on 32-bit ARM). The
  # race detector is 64-bit only, so this runs without it; a 386 binary executes
  # on the amd64 runner.
  test-386:
    name: Test (386)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Run tests (GOARCH=386)
        env:
          GOARCH: '386'
        run: go test ./...

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}

  vet:
    name: Vet
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        goarch: [amd64, arm64, '386']
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Run go vet
        env:
          GOARCH: ${{ matrix.goarch }}
        run: go vet ./...

  build:
    name: Build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goos: [linux, darwin, windows]
        goarch: [amd64, arm64]
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: go build ./...

  fuzz:
    name: Fuzz smoke
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
      # A short bounded run of the demuxer fuzz target on every build. The
      # reader parses untrusted bytes, so this guards against panics and
      # unbounded allocation on malformed input; a crash is committed under
      # testdata/fuzz as a regression seed.
      - name: Fuzz reader
        run: go test -run='^$' -fuzz=FuzzReader -fuzztime=30s .
      # The segment writer computes trun's data_offset rather than copying it, so
      # a layout mistake shows up as silently wrong output instead of an error.
      # This target asserts the offset resolves to the mdat payload every time.
      - name: Fuzz fragment writer
        run: go test -run='^$' -fuzz=FuzzFragmentWriter -fuzztime=30s .
      # The reservation arithmetic is a pure function of numbers a file declares
      # about itself, and its result goes straight into a make. These targets
      # prove the bounds hold for every input rather than for the table rows
      # someone thought of, and they need no fixtures and no codec, so they run
      # at millions of executions per second.
      - name: Fuzz flacm4a reservation
        run: |
          go test -run='^$' -fuzz=FuzzPCMReservation -fuzztime=20s ./flacm4a
          go test -run='^$' -fuzz=FuzzFrameReservation -fuzztime=20s ./flacm4a
      - name: Fuzz opusm4a reservation
        run: go test -run='^$' -fuzz=FuzzPCMReservation -fuzztime=20s ./opusm4a
      # ShouldTrim moved to internal/reservation in the moov de-dup refactor; fuzz it
      # where it now lives rather than in the bridges, where -fuzz matches nothing and
      # would pass without running.
      - name: Fuzz reservation trim policy
        run: go test -run='^$' -fuzz=FuzzShouldTrim -fuzztime=20s ./internal/reservation
      # The box table parsers turn an attacker-controlled entry count into a make,
      # so the entry-count-versus-payload bound is the MP4 table-expansion defence.
      # FuzzReader reaches them only through full container framing; these hit each
      # parser body directly, and run at millions of executions per second.
      - name: Fuzz box parsers
        run: |
          for target in FuzzParseStsz FuzzParseStsc FuzzParseStco FuzzParseCo64 FuzzParseStts FuzzParseDfla FuzzParseDops FuzzParseTfhd FuzzParseTrun; do
            go test -run='^$' -fuzz="$target" -fuzztime=10s ./internal/box
          done
      # The bridges hand attacker-controlled container bytes to third-party codecs.
      # These targets assert the bridge's own contract (no panic, decoded size within
      # the ceiling) and, for FLAC, the lossless round-trip property. They decode real
      # audio so they run at tens of executions per second, not millions; the value is
      # the seed corpus growing across builds, so the per-build budget stays short.
      - name: Fuzz flacm4a bridge
        run: |
          go test -run='^$' -fuzz=FuzzRoundTrip -fuzztime=20s ./flacm4a
          go test -run='^$' -fuzz=FuzzDecodeInterleaved -fuzztime=20s ./flacm4a
      - name: Fuzz opusm4a bridge
        run: go test -run='^$' -fuzz=FuzzDecodeInterleaved -fuzztime=20s ./opusm4a
